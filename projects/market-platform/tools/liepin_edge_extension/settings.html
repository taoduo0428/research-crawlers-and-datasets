<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liepin Bridge Settings</title>
</head>
<body>
  <main>
    <h1>Liepin Bridge Settings</h1>
    <p>Paste the current runtime token from the bridge token file.</p>
    <form id="token-form">
      <label for="token">Runtime token</label>
      <input id="token" name="token" type="password" autocomplete="off" required>
      <button type="submit">Save</button>
    </form>
    <p id="status" role="status"></p>
  </main>
  <script src="settings.js"></script>
</body>
</html>
