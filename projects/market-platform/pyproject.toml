[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drv-market-crawler"
version = "0.1.0"
description = "Standalone bounded crawlers for Chinese outsourcing and job-price samples"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests[socks]>=2.32,<3",
  "curl-cffi>=0.13,<1",
  "certifi>=2024.2.2",
  "beautifulsoup4>=4.12,<5",
  "playwright>=1.40,<2",
  "PyYAML>=6,<7",
  "openpyxl>=3.1,<4",
  "websocket-client>=1.8,<2",
  "psutil>=7,<8",
]

[project.scripts]
drv-crawler = "drv_crawler.cli:main"

[tool.setuptools.packages.find]
include = ["drv_crawler*"]
